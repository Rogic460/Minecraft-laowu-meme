buildscript {
	repositories {
		// loom 1.12.x 的传递依赖（guava / cadixdev at / lorenz 等）在 Maven Central，fabricmc maven 没有
		mavenCentral()
		maven { url = "https://maven.fabricmc.net" }
	}
	dependencies {
		// 1.12/1.13 系没有 gradle plugin marker，必须用旧式 buildscript classpath 加载。
		// 本分支用 1.13.6（与 26.x / 1.21.11 同款），原因：
		//  - loom 1.13.6 支持 MC 1.21（"Failed to find minecraft version: 1.21.0" 是版本 id 写错——MC 没有 1.21.0，初版 id 是 "1.21"，见 gradle.properties）。
		//  - loom 1.12.4 内置 tiny-remapper 在 JDK 25 上关闭 zip FileSystem 死锁（remap sources 卡死 18min）；1.13.6 的 tiny-remapper 无此问题（1.21.11 已验证）。
		classpath "net.fabricmc:fabric-loom:1.13.6"
	}
}

apply plugin: "fabric-loom"
// maven-publish 用旧式 apply（loom 1.12.x 无 plugin marker，不能走 plugins{} 块）
apply plugin: "maven-publish"

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	mavenCentral()
	maven { url = "https://maven.fabricmc.net" }
	maven { url = "https://api.modrinth.com/maven" }
	// ModMenu 旧版（如 11.0.0 对应 1.21.0）仅在 TerraformersMC maven，modrinth maven 只镜像 17.0.0+
	maven { url = "https://maven.terraformersmc.com/" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"laowu_meme" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// loom 1.12.x 必须显式声明 mappings（无默认）。
	// 用 mojmap（官方映射）：本 mod 源码整体是 mojmap 命名（26.x 移植），零翻译成本。
	// yarn 备选（如 mojmap 撞 AW 命名空间问题再切回，需全量翻译源码）：
	// mappings "net.fabricmc:yarn:1.21.11+build.6:v2"
	mappings loom.officialMojangMappings()
	// 1.21.x 时代的 mod 依赖是 intermediary 命名，必须用 modImplementation 让 loom remap 到 mojmap，
	// 用 implementation 会直接暴露 class_xxxx 名 → 编译错误（26.x 时代 fabric-api 带 mojmap 变体才可以直用）。
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// ModMenu（客户端配置界面，软依赖）。1.21.0 用 TerraformersMC maven 的 11.0.0（modrinth maven 只镜像 17.0.0+）
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

}

processResources {
	def version = project.version
	def mcVersion = project.minecraft_version
	inputs.property "version", version
	inputs.property "minecraft_version", mcVersion

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_version": mcVersion
	}
}

// 双保险：猫贴图同时复制到 assets/laowu_meme/entity/cat/（无 textures/ 前缀版）。
// 1.21.0/1.21.1 经典管线换皮曾多轮黑紫（textures/ 前缀 + .png 格式歧义），
// 无论加载器按哪种格式解析（assets/<ns>/textures/<path>.png 或 assets/<ns>/<path>.png）都能命中。
tasks.register('duplicateCatTextures', Copy) {
	from("src/main/resources/assets/laowu_meme/textures/entity/cat") {
		include "*.png"
		into "assets/laowu_meme/entity/cat"
	}
	into layout.buildDirectory.dir("resources/main")
}
processResources.dependsOn tasks.named('duplicateCatTextures')

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// jar 文件名标注覆盖的 MC 版本：laowu_meme-1.2.1+1.21.0-1.21.1.jar
// 一个 jar 通吃 1.21.0 与 1.21.1（两者 client intermediary 映射一致，javap 验证 field_3435 等相同）。
// loom 的最终产物是 remapJar（jar 任务只出中间 dev jar），自定义名必须设在 remapJar 上。
tasks.named("remapJar") {
	archiveFileName = "${project.name}-${project.version}+1.21.0-1.21.1.jar"
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	// repositories {
	// 	// Add repositories to publish to here.
	// 	// Notice: This block does NOT have the same function as the block in the top level.
	// 	// The repositories here will be used for publishing your artifact, not for
	// 	// retrieving dependencies.
	// }
}
