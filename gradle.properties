# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512M
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# 1.21.1 经典管线分支（Fabric 0.19.2，loader 0.16.10，api 0.116.12+1.21.1）。JDK 25 作 gradle JVM（options.release=21 交叉编译到 21）。
# 关键事实：Minecraft 没有 "1.21.0" 版本号，1.21 系列初版 id 就是 "1.21"（.0 隐含）；写 1.21 会被 loom 解析成 1.21.0。
#   1.21.0 与 1.21.1 的 client intermediary 映射完全一致（CatModel/OcelotModel 字段号 field_3435 等相同，javap 验证），
#   故一个 jar 通吃两版：构建基线上 1.21.1（已缓存），metadata minecraft 声明 [">=1.21","<1.21.2"] 同时接纳 1.21.0 与 1.21.1，排除 1.21.2+（RenderState 墙）。
#   早期误判"@Shadow 黑屏是 1.21.0/1.21.1 中间名对不上"是错的：真因是 @Shadow 取了父类 OcelotModel 的字段（见 CatModelMixin/OcelotModelAccessor）。
# loom 1.13.6：与 26.x / 1.21.11 同款。支持 MC 1.21，且内置 tiny-remapper 在 JDK 25 上不卡（1.12.4 会死锁）。
#   （注：build.gradle buildscript 的 loom 版本是硬编码的，gradle.properties 的 loom_version 仅作记录，不被读取。）

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
loader_version=0.16.10
loom_version=1.13.6

# Mod Properties
mod_version=1.3.0
maven_group=com.rogic

# Dependencies
fabric_api_version=0.116.12+1.21.1
modmenu_version=11.0.0
